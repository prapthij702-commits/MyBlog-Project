
<!DOCTYPE html>
<html>
<head>
    <title>My Blog Application</title>
</head>
<body>

    <h1>Welcome to My Blog</h1>

    <!-- User Registration -->
    <h2>User Registration</h2>

    <input type="text" id="name" placeholder="Enter your name">
    <br><br>

    <input type="email" id="email" placeholder="Enter your email">
    <br><br>

    <input type="password" id="password" placeholder="Enter your password">
    <br><br>

    <button onclick="registerUser()">Register</button>
    <p id="message"></p>

    <hr>

    <!-- User Login -->
    <h2>User Login</h2>

    <input type="email" id="loginEmail" placeholder="Enter your email">
    <br><br>

    <input type="password" id="loginPassword" placeholder="Enter your password">
    <br><br>

    <button onclick="loginUser()">Login</button>
    <p id="loginMessage"></p>

    <hr>

    <!-- Create Blog -->
    <h2>Create a New Blog</h2>

    <input type="text" id="blogTitle" placeholder="Enter blog title">
    <br><br>

    <textarea id="blogContent"
        placeholder="Write your blog here"
        rows="6" cols="40"></textarea>
    <br><br>

    <button onclick="createBlog()">Publish Blog</button>

    <p id="blogMessage"></p>

    <hr>

    <!-- View Blogs -->
    <h2>All Published Blogs</h2>

    <button onclick="loadBlogs()">View Blogs</button>

    <div id="blogList"></div>

    <script>

    // Registration
    async function registerUser() {

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("http://localhost:5000/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, email, password })
            });

            const data = await response.json();
            document.getElementById("message").innerText = data.message;

        } catch (error) {
            document.getElementById("message").innerText =
                "Unable to connect to backend";
        }
    }

    // Login
    async function loginUser() {

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        try {
            const response = await fetch("http://localhost:5000/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            document.getElementById("loginMessage").innerText = data.message;

        } catch (error) {
            document.getElementById("loginMessage").innerText =
                "Unable to connect to backend";
        }
    }

    // Create Blog
    async function createBlog() {

        const title = document.getElementById("blogTitle").value;
        const content = document.getElementById("blogContent").value;

        try {
            const response = await fetch("http://localhost:5000/api/blogs", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ title, content })
            });

            const data = await response.json();

            document.getElementById("blogMessage").innerText = data.message;

            if (response.ok) {
                document.getElementById("blogTitle").value = "";
                document.getElementById("blogContent").value = "";
                loadBlogs();
            }

        } catch (error) {
            document.getElementById("blogMessage").innerText =
                "Unable to connect to backend";
        }
    }

    // View Blogs
    async function loadBlogs() {

        try {
            const response = await fetch("http://localhost:5000/api/blogs");
            const blogs = await response.json();

            const blogList = document.getElementById("blogList");
            blogList.innerHTML = "";

            blogs.forEach(function(blog) {

                const blogItem = document.createElement("div");

                const heading = document.createElement("h3");
                heading.innerText = blog.title;

                const paragraph = document.createElement("p");
                paragraph.innerText = blog.content;

                // Edit button
                const editButton = document.createElement("button");
                editButton.innerText = "Edit";
                editButton.onclick = function() {
                    editBlog(blog.id, blog.title, blog.content);
                };

                // Delete button
                const deleteButton = document.createElement("button");
                deleteButton.innerText = "Delete";
                deleteButton.onclick = function() {
                    deleteBlog(blog.id);
                };

                blogItem.appendChild(heading);
                blogItem.appendChild(paragraph);
                blogItem.appendChild(editButton);
                blogItem.appendChild(deleteButton);

                blogList.appendChild(blogItem);
            });

            if (blogs.length === 0) {
                blogList.innerText = "No blogs published yet.";
            }

        } catch (error) {
            document.getElementById("blogList").innerText =
                "Unable to load blogs";
        }
    }

    // Edit Blog
    async function editBlog(id, oldTitle, oldContent) {

        const title = prompt("Enter new blog title:", oldTitle);

        if (title === null) return;

        const content = prompt("Enter new blog content:", oldContent);

        if (content === null) return;

        try {
            const response = await fetch(
                "http://localhost:5000/api/blogs/" + id,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ title, content })
                }
            );

            const data = await response.json();

            document.getElementById("blogMessage").innerText = data.message;

            if (response.ok) {
                loadBlogs();
            }

        } catch (error) {
            document.getElementById("blogMessage").innerText =
                "Unable to update blog";
        }
    }

    // Delete Blog
    async function deleteBlog(id) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this blog?"
        );

        if (!confirmDelete) return;

        try {
            const response = await fetch(
                "http://localhost:5000/api/blogs/" + id,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            document.getElementById("blogMessage").innerText = data.message;

            if (response.ok) {
                loadBlogs();
            }

        } catch (error) {
            document.getElementById("blogMessage").innerText =
                "Unable to delete blog";
        }
    }

    </script>

</body>
</html>
