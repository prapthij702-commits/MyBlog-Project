
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #2563eb;
        }

        #blogDetails {
            margin-top: 25px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout {
            background: #dc2626;
        }

        .message {
            text-align: center;
            color: red;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Blog Details</h1>

    <div id="blogDetails">
        Loading blog...
    </div>

    <div class="buttons">

        <button onclick="goBack()">
            Back to Dashboard
        </button>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</div>

<script>

const API = "https://myblog-project-xdix.onrender.com/api";

// Get JWT token
function getToken() {
    return localStorage.getItem("token");
}

// Load blog details
async function loadBlogDetails() {

    const params = new URLSearchParams(window.location.search);

    const blogId = params.get("id");

    const details = document.getElementById("blogDetails");

    // Check login
    if (!getToken()) {

        details.textContent = "Please login to view blog details.";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

        return;
    }

    // Check blog ID
    if (!blogId || !/^[1-9]\d*$/.test(blogId)) {

        details.textContent = "Invalid blog ID.";

        return;
    }

    try {

        const response = await fetch(`${API}/blogs`, {

            method: "GET",

            headers: {
                "Authorization": "Bearer " + getToken()
            }

        });

        if (response.status === 401 || response.status === 403) {

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            details.textContent = "Session expired. Please login again.";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);

            return;
        }

        const blogs = await response.json();

        if (!response.ok) {

            details.textContent = blogs.message || "Unable to load blogs.";

            return;
        }

        // Find blog belonging to logged-in user
        const blog = blogs.find(
            item => String(item.id) === blogId
        );

        if (!blog) {

            details.textContent = "Blog not found or access denied.";

            return;
        }

        // Display blog title
        const title = document.createElement("h2");

        title.textContent = blog.title;

        // Display blog content
        const content = document.createElement("p");

        content.textContent = blog.content;

        // Display blog creation date if available
        details.innerHTML = "";

        details.appendChild(title);
        details.appendChild(content);

        if (blog.created_at) {

            const date = document.createElement("small");

            date.textContent =
                "Created on: " +
                new Date(blog.created_at).toLocaleString();

            details.appendChild(date);

        }

    } catch (error) {

        details.textContent = "Unable to connect to backend.";

    }

}

// Back to dashboard
function goBack() {

    window.location.href = "index.html";

}

// Logout
function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    window.location.href = "index.html";

}

// Run when page opens
loadBlogDetails();

</script>

</body>

</html>
