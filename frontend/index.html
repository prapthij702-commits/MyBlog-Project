
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete {
            background: #dc2626;
        }

        .logout {
            background: #555;
        }

        .blog {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }

        #blogSection {
            display: none;
        }

        #message {
            text-align: center;
            color: green;
        }

        #welcome {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Blog Application</h1>

    <p id="message"></p>

    <!-- REGISTER AND LOGIN SECTION -->
    <section id="authSection">

        <h2>Register</h2>

        <input id="name" placeholder="Enter your name">

        <input
            id="registerEmail"
            type="email"
            placeholder="Enter email"
        >

        <input
            id="registerPassword"
            type="password"
            placeholder="Enter password"
        >

        <button onclick="register()">Register</button>

        <hr>

        <h2>Login</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Enter email"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter password"
        >

        <button onclick="login()">Login</button>

    </section>

    <!-- BLOG SECTION -->
    <section id="blogSection">

        <p id="welcome"></p>

        <h2>Create a Blog</h2>

        <input
            id="title"
            placeholder="Blog title"
        >

        <textarea
            id="content"
            placeholder="Write your blog..."
            rows="5"
        ></textarea>

        <button onclick="createBlog()">Publish Blog</button>

        <button class="logout" onclick="logout()">Logout</button>

        <h2>My Blogs</h2>

        <input
            id="search"
            type="text"
            placeholder="Search blogs by title..."
            oninput="loadBlogs()"
        >

        <div id="blogs"></div>

    </section>

</div>

<script>

// LIVE BACKEND API URL
const API = "https://myblog-project-xdix.onrender.com/api";

// Show messages
function showMessage(message) {
    document.getElementById("message").textContent = message;
}

// Get JWT token
function getToken() {
    return localStorage.getItem("token");
}

// Headers for protected API requests
function authHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + getToken()
    };
}

// Handle expired or invalid token
function handleUnauthorized() {

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    document.getElementById("blogSection").style.display = "none";
    document.getElementById("authSection").style.display = "block";

    showMessage("Session expired. Please login again.");
}

// REGISTER
async function register() {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;

    if (!name || !email || !password) {
        showMessage("Please fill all registration fields.");
        return;
    }

    try {

        const response = await fetch(`${API}/register`, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name,
                email,
                password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "Registration failed");
            return;
        }

        showMessage("Registration successful! Please login.");

        document.getElementById("name").value = "";
        document.getElementById("registerEmail").value = "";
        document.getElementById("registerPassword").value = "";

    } catch (error) {

        showMessage("Cannot connect to backend.");

    }
}

// LOGIN
async function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
        showMessage("Please enter email and password.");
        return;
    }

    try {

        const response = await fetch(`${API}/login`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "Login failed");
            return;
        }

        // Save JWT token
        localStorage.setItem("token", data.token);

        // Save user information
        localStorage.setItem("user", JSON.stringify(data.user));

        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";

        showMessage("Login successful!");

        await showDashboard();

    } catch (error) {

        showMessage("Cannot connect to backend.");

    }
}

// SHOW DASHBOARD
async function showDashboard() {

    const user = JSON.parse(localStorage.getItem("user") || "null");

    document.getElementById("authSection").style.display = "none";
    document.getElementById("blogSection").style.display = "block";

    document.getElementById("welcome").textContent =
        "Welcome, " + (user ? user.name : "User") + "!";

    await loadBlogs();
}

// LOAD AND SEARCH BLOGS
async function loadBlogs() {

    if (!getToken()) {
        handleUnauthorized();
        return;
    }

    try {

        const response = await fetch(`${API}/blogs`, {
            method: "GET",
            headers: authHeaders()
        });

        if (response.status === 401 || response.status === 403) {
            handleUnauthorized();
            return;
        }

        const blogs = await response.json();

        if (!response.ok) {
            showMessage(blogs.message || "Could not load blogs.");
            return;
        }

        const blogList = document.getElementById("blogs");

        blogList.innerHTML = "";

        const searchText = document
            .getElementById("search")
            .value
            .toLowerCase();

        const filteredBlogs = blogs.filter(blog =>
            blog.title.toLowerCase().includes(searchText)
        );

        if (filteredBlogs.length === 0) {

            blogList.textContent = "No blogs found.";

            return;
        }

        filteredBlogs.forEach(blog => {

            const div = document.createElement("div");

            div.className = "blog";

            const heading = document.createElement("h3");

            heading.textContent = blog.title;

            const paragraph = document.createElement("p");

            paragraph.textContent = blog.content;

            // VIEW DETAILS BUTTON
            const viewButton = document.createElement("button");

            viewButton.textContent = "View Details";

            viewButton.onclick = () => {

                window.location.href =
                    `blog-details.html?id=${blog.id}`;

            };

            // EDIT BUTTON
            const editButton = document.createElement("button");

            editButton.textContent = "Edit";

            editButton.onclick = () => {

                editBlog(blog.id, blog.title, blog.content);

            };

            // DELETE BUTTON
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className = "delete";

            deleteButton.onclick = () => {

                deleteBlog(blog.id);

            };

            div.append(
                heading,
                paragraph,
                viewButton,
                editButton,
                deleteButton
            );

            blogList.appendChild(div);

        });

    } catch (error) {

        showMessage("Could not load blogs.");

    }
}

// CREATE BLOG
async function createBlog() {

    const title = document.getElementById("title").value.trim();

    const content = document.getElementById("content").value.trim();

    if (!title || !content) {

        showMessage("Please enter blog title and content.");

        return;
    }

    try {

        const response = await fetch(`${API}/blogs`, {

            method: "POST",

            headers: authHeaders(),

            body: JSON.stringify({
                title,
                content
            })

        });

        const data = await response.json();

        if (response.status === 401 || response.status === 403) {
            handleUnauthorized();
            return;
        }

        if (!response.ok) {

            showMessage(data.message || "Could not create blog");

            return;
        }

        document.getElementById("title").value = "";

        document.getElementById("content").value = "";

        showMessage("Blog created successfully!");

        await loadBlogs();

    } catch (error) {

        showMessage("Could not create blog.");

    }
}

// EDIT BLOG
async function editBlog(id, oldTitle, oldContent) {

    const title = prompt("Enter new title:", oldTitle);

    if (title === null) return;

    const content = prompt("Enter new content:", oldContent);

    if (content === null) return;

    if (!title.trim() || !content.trim()) {
        showMessage("Title and content cannot be empty.");
        return;
    }

    try {

        const response = await fetch(`${API}/blogs/${id}`, {

            method: "PUT",

            headers: authHeaders(),

            body: JSON.stringify({
                title: title.trim(),
                content: content.trim()
            })

        });

        const data = await response.json();

        if (response.status === 401 || response.status === 403) {
            handleUnauthorized();
            return;
        }

        if (!response.ok) {

            showMessage(data.message || "Update failed");

            return;
        }

        showMessage("Blog updated successfully!");

        await loadBlogs();

    } catch (error) {

        showMessage("Could not update blog.");

    }
}

// DELETE BLOG
async function deleteBlog(id) {

    if (!confirm("Are you sure you want to delete this blog?")) {
        return;
    }

    try {

        const response = await fetch(`${API}/blogs/${id}`, {

            method: "DELETE",

            headers: authHeaders()

        });

        const data = await response.json();

        if (response.status === 401 || response.status === 403) {
            handleUnauthorized();
            return;
        }

        if (!response.ok) {

            showMessage(data.message || "Delete failed");

            return;
        }

        showMessage("Blog deleted successfully!");

        await loadBlogs();

    } catch (error) {

        showMessage("Could not delete blog.");

    }
}

// LOGOUT
function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    document.getElementById("blogSection").style.display = "none";

    document.getElementById("authSection").style.display = "block";

    document.getElementById("blogs").innerHTML = "";

    document.getElementById("search").value = "";

    showMessage("Logged out successfully.");

}

// CHECK LOGIN WHEN PAGE OPENS
async function checkLogin() {

    if (!getToken()) {
        return;
    }

    try {

        const response = await fetch(`${API}/profile`, {
            method: "GET",
            headers: authHeaders()
        });

        if (!response.ok) {

            handleUnauthorized();

            return;
        }

        const data = await response.json();

        localStorage.setItem("user", JSON.stringify(data.user));

        await showDashboard();

    } catch (error) {

        showMessage("Cannot connect to backend. Please try again.");

    }
}

// RUN WHEN PAGE LOADS
checkLogin();

</script>

</body>
</html>
