
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete {
            background: #dc2626;
        }

        .blog {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }

        #blogSection {
            display: none;
        }

        #message {
            text-align: center;
            color: green;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>My Blog Application</h1>
    <p id="message"></p>

    <section id="authSection">
        <h2>Register</h2>

        <input id="name" placeholder="Enter your name">
        <input id="registerEmail" type="email" placeholder="Enter email">
        <input id="registerPassword" type="password" placeholder="Enter password">

        <button onclick="register()">Register</button>

        <hr>

        <h2>Login</h2>

        <input id="loginEmail" type="email" placeholder="Enter email">
        <input id="loginPassword" type="password" placeholder="Enter password">

        <button onclick="login()">Login</button>
    </section>

    <section id="blogSection">
        <h2>Create a Blog</h2>

        <input id="title" placeholder="Blog title">
        <textarea id="content" placeholder="Write your blog..." rows="5"></textarea>

        <button onclick="createBlog()">Publish Blog</button>
        <button onclick="logout()">Logout</button>

        <h2>All Blogs</h2>
        <div id="blogs"></div>
    </section>

</div>

<script>
const API = "http://localhost:5000/api";

function showMessage(message) {
    document.getElementById("message").textContent = message;
}

async function register() {
    try {
        const response = await fetch(`${API}/register`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                name: document.getElementById("name").value,
                email: document.getElementById("registerEmail").value,
                password: document.getElementById("registerPassword").value
            })
        });

        const data = await response.json();
        showMessage(data.message || "Registration failed");
    } catch (error) {
        showMessage("Cannot connect to backend.");
    }
}

async function login() {
    try {
        const response = await fetch(`${API}/login`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "Login failed");
            return;
        }

        document.getElementById("authSection").style.display = "none";
        document.getElementById("blogSection").style.display = "block";

        showMessage("Welcome! Login successful.");
        loadBlogs();

    } catch (error) {
        showMessage("Cannot connect to backend.");
    }
}

async function loadBlogs() {
    try {
        const response = await fetch(`${API}/blogs`);
        const blogs = await response.json();

        const blogList = document.getElementById("blogs");
        blogList.innerHTML = "";

        blogs.forEach(blog => {
            const div = document.createElement("div");
            div.className = "blog";

            const heading = document.createElement("h3");
            heading.textContent = blog.title;

            const paragraph = document.createElement("p");
            paragraph.textContent = blog.content;

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.onclick = () => editBlog(blog.id, blog.title, blog.content);

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";
            deleteButton.onclick = () => deleteBlog(blog.id);

            div.append(heading, paragraph, editButton, deleteButton);
            blogList.appendChild(div);
        });

    } catch (error) {
        showMessage("Could not load blogs.");
    }
}

async function createBlog() {
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;

    try {
        const response = await fetch(`${API}/blogs`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({title, content})
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "Could not create blog");
            return;
        }

        document.getElementById("title").value = "";
        document.getElementById("content").value = "";

        showMessage("Blog created successfully!");
        loadBlogs();

    } catch (error) {
        showMessage("Could not create blog.");
    }
}

async function editBlog(id, oldTitle, oldContent) {
    const title = prompt("Enter new title:", oldTitle);
    if (title === null) return;

    const content = prompt("Enter new content:", oldContent);
    if (content === null) return;

    try {
        const response = await fetch(`${API}/blogs/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({title, content})
        });

        const data = await response.json();
        showMessage(data.message || "Update completed");
        loadBlogs();

    } catch (error) {
        showMessage("Could not update blog.");
    }
}

async function deleteBlog(id) {
    if (!confirm("Are you sure you want to delete this blog?")) return;

    try {
        const response = await fetch(`${API}/blogs/${id}`, {
            method: "DELETE"
        });

        const data = await response.json();
        showMessage(data.message || "Delete completed");
        loadBlogs();

    } catch (error) {
        showMessage("Could not delete blog.");
    }
}

function logout() {
    document.getElementById("blogSection").style.display = "none";
    document.getElementById("authSection").style.display = "block";
    showMessage("Logged out successfully.");
}
</script>

</body>
</html>
